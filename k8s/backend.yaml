apiVersion: apps/v1
kind: Deployment
metadata:
  name: reserve-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reserve-backend
  template:
    metadata:
      labels:
        app: reserve-backend
    spec:
      containers:
      - name: backend
        image: reserve-backend:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: reserve-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: reserve-secret
              key: SECRET_KEY
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: reserve-backend
spec:
  selector:
    app: reserve-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
