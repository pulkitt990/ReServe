services:
  - type: web
    name: reserve-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reserve-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: reserve-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reserve-cache
    ipAllowList: []
          property: connectionString
      - key: PYTHONPATH
        value: /app

  - type: redis
    name: reserve-cache
    ipAllowList: []
    plan: free
    region: oregon

databases:
  - name: reserve-db
    plan: free
    region: oregon
